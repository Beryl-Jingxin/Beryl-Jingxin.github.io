name: Build and deploy academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Generate site pages and academic data
        run: python3 scripts/build-site.py
      - name: Assemble site
        run: |
          mkdir -p _site/theme _site/data _site/figures
          cp index.html about.html research.html publications.html conferences.html contact.html _site/
          cp theme/style.css theme/script.js _site/theme/
          cp data/*-data.js data/JingxinZhang_CV.pdf _site/data/
          cp -R figures/. _site/figures/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
